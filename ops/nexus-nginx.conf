map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $http_x_forwarded_proto $nexus_forwarded_proto {
    default $scheme;
    http http;
    https https;
}
map $http_upgrade $nexus_inference_upstream {
    default http://app:3000;
    ~*^websocket$ http://cpa:8317;
}
map "$http_upgrade:$request_uri" $nexus_private_native_route {
    default 0;
    ~*^websocket: 1;
    ~^:/(?:cpa-api/|openai/)?v1/(?:models|chat/completions|messages(?:/count_tokens)?|responses|systemone)/?(?:\?|$) 0;
    ~^:/(?:v1(?:/|$)|v1beta(?:/|$)|openai/v1(?:/|$)|backend-api/codex(?:/|$)|api/provider(?:/|$)|cpa-api(?:/|$)) 1;
}
map $nexus_private_native_route $nexus_client_session { 1 ""; default $http_x_session_id; }
map $nexus_private_native_route $nexus_session_id { 1 ""; default $http_session_id; }
map $nexus_private_native_route $nexus_claude_session { 1 ""; default $http_x_claude_code_session_id; }
map $nexus_private_native_route $nexus_codex_session { 1 ""; default $http_x_codex_session_id; }
map $nexus_private_native_route $nexus_agent_id { 1 ""; default $http_x_agent_id; }
map $nexus_private_native_route $nexus_subagent_id { 1 ""; default $http_x_subagent_id; }
map $nexus_private_native_route $nexus_browser_cookie { 1 ""; default $http_cookie; }
map $nexus_private_native_route $nexus_origin { 1 ""; default $http_origin; }
map $nexus_private_native_route $nexus_forwarded_address { 1 ""; default $proxy_add_x_forwarded_for; }
map $nexus_private_native_route $nexus_real_address { 1 ""; default $remote_addr; }

server {
    listen 3000;
    server_name _;
    # Upload and model request bodies have no application-imposed size limit.
    client_max_body_size 0;

    # Resolve container names again after an independent core/app recreate.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $nexus_app http://app:3000;
    set $nexus_cpa http://cpa:8317;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $nexus_real_address;
    proxy_set_header X-Forwarded-For $nexus_forwarded_address;
    proxy_set_header X-Forwarded-Proto $nexus_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Keep private local affinity context on Nexus routes. Native direct routes
    # do not receive raw client identifiers; authentication and turn-state stay intact.
    proxy_set_header User-Agent opencode;
    proxy_set_header Originator opencode;
    proxy_set_header X-Session-Id $nexus_client_session;
    proxy_set_header Session_Id $nexus_session_id;
    proxy_set_header X-Claude-Code-Session-Id $nexus_claude_session;
    proxy_set_header X-Codex-Session-Id $nexus_codex_session;
    proxy_set_header X-Agent-Id $nexus_agent_id;
    proxy_set_header X-Subagent-Id $nexus_subagent_id;
    proxy_set_header Cookie $nexus_browser_cookie;
    proxy_set_header Origin $nexus_origin;
    proxy_set_header Referer "";
    proxy_set_header X-Stainless-Lang "";
    proxy_set_header X-Stainless-OS "";
    proxy_set_header X-Stainless-Arch "";
    proxy_set_header X-Stainless-Package-Version "";
    proxy_set_header X-Stainless-Runtime "";
    proxy_set_header X-Stainless-Runtime-Version "";
    proxy_set_header X-Opencode-Project "";
    proxy_set_header X-Opencode-Directory "";
    proxy_set_header X-Device-Id "";
    proxy_set_header Sec-Ch-UA "";
    proxy_set_header Sec-Ch-UA-Platform "";
    proxy_set_header Sec-Ch-UA-Mobile "";
    proxy_set_header Traceparent "";
    proxy_set_header Tracestate "";
    proxy_set_header Baggage "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 10s;
    proxy_ignore_client_abort off;

    # CPA management keys stay on the server. Both direct and prefixed forms
    # are blocked; the authenticated Nexus /api/cpa adapter is the entry point.
    location ~* ^/(?:cpa-api/)?(?:v[08]/management(?:/|$)|v0/resource(?:/|$)|management\.html(?:/|$)) {
        return 404;
    }

    # These are never public assets even if a future CPA route serves files.
    location ~* ^/cpa-api/(?:config(?:\.ya?ml|/|$)|auths?(?:/|$)|plugins(?:/|$)|logs(?:/|$)|\.cli-proxy-api(?:/|$)) {
        return 404;
    }

    # Original account import/add, external jobs/pool, and key administration
    # belong to Nexus. Its admin/service-key middleware enforces authorization.
    location ~ ^/api/(?:accounts|external|jobs|pool|keys|service-keys)(?:/|$) {
        proxy_pass $nexus_app;
    }

    # CommandCode's native System One endpoint is not implemented by CPA.
    # It keeps the module's ccm_ authorization and official upstream protocol.
    location = /v1/systemone {
        proxy_pass $nexus_app;
    }
    location = /cpa-api/v1/systemone {
        rewrite ^/cpa-api/(.*)$ /$1 break;
        proxy_pass $nexus_app;
    }
    # Explicit module namespace retains existing CommandCode access keys.
    location ^~ /commandcode/v1/ {
        proxy_pass $nexus_app;
    }

    # The public inference adapter restores original ccm_ keys on /v1 and
    # applies enabled preset routes. The app's internal /v1 callback is separate.
    location ~ ^/(?:cpa-api/|openai/)?v1/(models|chat/completions|messages(?:/count_tokens)?|responses)/?$ {
        if ($http_upgrade !~* "^websocket$") {
            rewrite ^/(?:cpa-api/|openai/)?v1/(.*)$ /nexus/cpa/v1/$1 break;
        }
        if ($http_upgrade ~* "^websocket$") {
            rewrite ^/(?:cpa-api/|openai/)?(v1/.*)$ /$1 break;
        }
        proxy_pass $nexus_inference_upstream;
    }

    # Native model protocols pass directly to the official CPA core.
    location ~ ^/(?:v1(?:/|$)|v1beta(?:/|$)|openai/v1(?:/|$)|backend-api/codex(?:/|$)|api/provider(?:/|$)) {
        proxy_pass $nexus_cpa;
    }

    # OAuth callback paths in the pinned official core reuse its HTTP listener.
    location ~ ^/(?:anthropic|codex|antigravity|devin)/callback$ {
        proxy_pass $nexus_cpa;
    }
    location = /callback {
        proxy_pass $nexus_cpa;
    }

    location = /cpa-api {
        return 308 /cpa-api/;
    }
    # Full CPA model namespace escape hatch. Strip only the leading /cpa-api.
    # Use a variable upstream to avoid stale Docker DNS after a core upgrade.
    location /cpa-api/ {
        rewrite ^/cpa-api/(.*)$ /$1 break;
        proxy_pass $nexus_cpa;
    }

    location / {
        proxy_pass $nexus_app;
    }
}
