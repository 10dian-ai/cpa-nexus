name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ccm
          POSTGRES_DB: commandcode
          POSTGRES_PASSWORD: integration-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ccm -d commandcode"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgres://ccm:integration-test-only@localhost:5432/commandcode
      TEST_DATABASE_URL: postgres://ccm:integration-test-only@localhost:5432/commandcode
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/15
      ADMIN_PASSWORD: integration-test-only
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://localhost:3000
      KERNEL_URL: http://localhost:3050
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.x', cache: false }
      - name: Build and verify the complete CPA kernel
        env:
          CPA_UPSTREAM_REF: e2bff0107bb307337aaa19018ccddd55f64253d5
        run: |
          set -euo pipefail
          core_source="$RUNNER_TEMP/cpa-nexus-core"
          git init --quiet "$core_source"
          git -C "$core_source" remote add origin https://github.com/router-for-me/CLIProxyAPI.git
          git -C "$core_source" fetch --depth 1 origin "$CPA_UPSTREAM_REF"
          git -C "$core_source" checkout --detach FETCH_HEAD
          test "$(git -C "$core_source" rev-parse HEAD)" = "$CPA_UPSTREAM_REF"
          git -C "$core_source" apply --check "$GITHUB_WORKSPACE/ops/cpa-nexus/nexus-plugins.patch"
          git -C "$core_source" apply "$GITHUB_WORKSPACE/ops/cpa-nexus/nexus-plugins.patch"
          cd "$core_source"
          go test ./sdk/cliproxy/auth ./sdk/api/handlers ./internal/pluginhost ./internal/api -count=1
          CGO_ENABLED=1 go build -buildvcs=false -o "$RUNNER_TEMP/cli-proxy-api-nexus" ./cmd/server/
          echo "TEST_CPA_BINARY=$RUNNER_TEMP/cli-proxy-api-nexus" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run check
